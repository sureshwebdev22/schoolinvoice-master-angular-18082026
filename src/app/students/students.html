<form [formGroup]="studentSearchForm">

    <div class="row g-3 align-items-end my-3">

        <!-- Create Button -->
         <div *ngIf="isAdmin" class="col-12 col-lg-3">
            <button
                type="button"
                class="btn btn-success w-100"
                (click)="studentcreate()">
                <i class="bi bi-plus-circle"></i>
                Create Student
            </button>
        </div>
       

        <!-- Search Box -->
        <div class="col-12 col-lg-7">
            <input
                type="text"
                class="form-control"
                formControlName="searchText"
                placeholder="Search by Admission No, Name, Class...">
        </div>

        <!-- Search Button -->
        <div class="col-12 col-lg-2">
            <button
                type="button"
                class="btn btn-primary w-100"
                (click)="searchStudents()">
                <i class="bi bi-search"></i>
                Search
            </button>
        </div>

    </div>

</form>

<div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
    <div class="mt-2">
        Loading Students...
    </div>
</div>


<div class="table-responsive" *ngIf="!loading">

<table class="table table-hover table-bordered align-middle">

    <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Admission No</th>
            <th>Name</th>
            <th>Class</th>
            <th>Section</th>
            <th>Status</th>
            <th width="180">Actions</th>
        </tr>
    </thead>

    <tbody>

        <tr *ngFor="let s of students">

            <td>{{s.studentId}}</td>
            <td>{{s.admissionNo}}</td>
            <td>{{s.firstName}} {{s.lastName}}</td>
            <td>{{s.className}}</td>
            <td>{{s.sectionName}}</td>
            <td>
                <span
                    class="badge"
                    [ngClass]="{
                        'bg-success': s.status=='ACTIVE',
                        'bg-danger': s.status=='INACTIVE'
                    }">
                    {{s.status}}
                </span>
            </td>

            <td class="text-nowrap">

                <button
                    class="btn btn-sm btn-outline-primary me-1"
                    (click)="viewStudent(s.studentId)">
                    <i class="bi bi-eye"></i>
                </button>

                <button
                    class="btn btn-sm btn-outline-success me-1">
                    <i class="bi bi-plus-circle"></i>
                </button>

                <button
                    class="btn btn-sm btn-outline-warning me-1"
                    (click)="editStudent(s.studentId)">
                    <i class="bi bi-pencil"></i>
                </button>

                <button
                    class="btn btn-sm btn-outline-danger"
                    (click)="deleteStudent(s.studentId)">
                    <i class="bi bi-trash"></i>
                </button>

            </td>

        </tr>

    </tbody>

</table>

</div>


<div class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-3">

    <button
        class="btn btn-secondary mb-2 mb-md-0"
        [disabled]="page==0"
        (click)="previousPage()">
        <i class="bi bi-arrow-left"></i>
        Previous
    </button>

    <span class="fw-bold mb-2 mb-md-0">
        Page {{page+1}} of {{totalPages}}
    </span>

    <button
        class="btn btn-secondary"
        [disabled]="page+1>=totalPages"
        (click)="nextPage()">
        Next
        <i class="bi bi-arrow-right"></i>
    </button>

</div>
