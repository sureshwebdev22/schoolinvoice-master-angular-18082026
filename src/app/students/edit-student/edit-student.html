<div class="container mt-4">

  <div class="card">
    <div class="card-header">
      <h3>Edit Student</h3>
    </div>

    <div class="card-body">
      <form [formGroup]="studentForm" (ngSubmit)="updateStudent()">
        <div class="row">
          <div class="col-md-6">
            <div class="mb-3 form-group">
              <label class="form-label">Admission No</label>
              <input type="text" class="form-control" formControlName="admissionNo">
            </div>
          </div>
          <div class="col-md-6">
            <div class="mb-3 form-group">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" formControlName="firstName">
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="mb-3 form-group">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" formControlName="lastName">
            </div>
          </div>

          <div class="col-md-6">
            <div class="mb-3 form-group">
              <label class="form-label">Gender</label>
              <select class="form-select" formControlName="gender">
                <option value="M">Male</option>
                <option value="F">Female</option>
              </select>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <div class="mb-3 form-group">
              <label class="form-label">Class</label>
              <input type="text" class="form-control" formControlName="className">
            </div>
          </div>
          <div class="col-md-6">
            <div class="mb-3 form-group">
              <label class="form-label">Section</label>
              <input type="text" class="form-control" formControlName="sectionName">
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <div class="mb-3 form-group">

              <label class="form-label">Status</label>
              <select id="status" class="form-select" formControlName="status">

                <option value="">-- Select Status --</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
              </select>

            </div>
          </div>
           <div class="col-md-6">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3 form-group">
                                    <label class="form-label">Parent Name</label>
                                    <input type="text" class="form-control" formControlName="parentName">
                                    <input type="hidden" class="form-control" formControlName="parentId">

                                </div>
                            </div>

                            <div class="col-md-6 d-flex align-items-end p-0 ">
                                <div class="mb-3 form-group"> <button type="button" class="btn btn-primary"
                                        data-bs-toggle="modal" data-bs-target="#parentSearchModal">

                                        <i class="bi bi-search"></i>

                                    </button>
                                </div>
                            </div>

                        </div> 
                    </div>  
        </div>


        <button class="btn btn-success" type="submit">
          <i class="bi bi-pencil-square"></i> Update
        </button>


        <button class="btn btn-secondary ms-2" routerLink="/students">
          Cancel
        </button>

      </form>

    </div>
  </div>

</div>

<app-search-parent (parentSelected)="onParentSelected($event)">
</app-search-parent>
