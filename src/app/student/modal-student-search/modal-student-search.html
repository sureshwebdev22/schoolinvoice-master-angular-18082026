<div class="modal fade" id="studentSearchModal" tabindex="-1">

  <div class="modal-dialog modal-xl">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Student Search</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="studentSearchForm" (ngSubmit)="searchStudents()">
          <!-- SEARCH -->
          <div class="row mb-3">

            <div class="col-md-3">
              <label>Admission No</label>
              <input class="form-control" formControlName="admissionNo" [formGroup]="studentSearchForm">
            </div>

            <div class="col-md-3">
              <label>Class Name</label>
              <input class="form-control" formControlName="className" [formGroup]="studentSearchForm">
            </div>

            <div class="col-md-3">
              <label>Section Name</label>
              <input class="form-control" formControlName="sectionName" [formGroup]="studentSearchForm">
            </div>

          </div>
          <div class="row m-3 align-items-center justify-content-center">
            <div class="col-md-2">
              <button class="btn btn-primary w-100" type="submit">
                search
                <i class="bi bi-search"></i>
              </button>
            </div>
            <div class="col-md-2">
              <button class="btn btn-secondary w-100" type="button" (click)="clearSearch()">
                Clear
              </button>
            </div>
          </div>
        </form>

        <div *ngIf="loading" class="text-center my-3">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-2">Loading...</p>
        </div>
        <!-- TABLE -->
        <table class="table table-bordered" *ngIf="!loading">
          <thead>
            <tr>
              <th>ID</th>
              <th>Admission No</th>
              <th>First Name</th>
              <th>Last Name</th>
            
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let s of students">
              <td>{{s.id}}</td>
              <td>{{s.admissionNo}}</td>
              <td>{{s.firstName}}</td>
              <td>{{s.lastName}}</td>
             
              <td>
                <button class="btn btn-success btn-sm" (click)="selectStudent(s)">
                  Select
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- PAGINATION -->
        <div class="d-flex justify-content-between">
          <button class="btn btn-secondary" (click)="previousPage()">Prev</button>
          <button class="btn btn-secondary" (click)="nextPage()">Next</button>
        </div>

      </div>

    </div>
  </div>

</div>
